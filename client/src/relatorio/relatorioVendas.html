<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3ede0;--surface:#fffdf9;--surface2:#ece2cc;--text:#2a1d10;--soft:#6b5d4d;--muted:#756a5d;
  --leather:#6b4423;--leather-d:#422a15;--leather-dd:#2f1c0d;--accent:#b5651d;--accent-h:#9a5416;--brass:#9c7a3c;--border:#ddd0b4;
  --ok:#33512f;--bad:#7a2a1d;--track:#ece2cc;--hover:#f7f1e4;
  --c0:#c4661c;--c1:#2f74b0;--c2:#5d8a2f;--c3:#a0438f;--c4:#b88a1f;
  --shadow:0 1px 2px rgba(66,42,21,.07),0 6px 18px rgba(66,42,21,.07);
  --shadow-l:0 -8px 30px rgba(47,28,13,.22);
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#1c1409;--surface:#2a1f13;--surface2:#352818;--text:#f5ebda;--soft:#cbb99e;--muted:#a8977f;
  --leather:#c08a57;--leather-d:#8a5a30;--accent:#d9832f;--accent-h:#e8964a;--brass:#c9a35c;--border:#54422d;
  --ok:#86b374;--bad:#e2806a;--track:#3a2c1c;--hover:#32261a;
  --c0:#d0742a;--c1:#4f8ccb;--c2:#6f9c3e;--c3:#b75ea6;--c4:#b38a2c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1c1409;--surface:#2a1f13;--surface2:#352818;--text:#f5ebda;--soft:#cbb99e;--muted:#a8977f;
    --leather:#c08a57;--leather-d:#8a5a30;--accent:#d9832f;--accent-h:#e8964a;--brass:#c9a35c;--border:#54422d;
    --ok:#86b374;--bad:#e2806a;--track:#3a2c1c;--hover:#32261a;
    --c0:#d0742a;--c1:#4f8ccb;--c2:#6f9c3e;--c3:#b75ea6;--c4:#b38a2c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;overflow-x:hidden}
.num,td.n,th.n,.kv,.ks,.val,.hv,.leg-v,.leg-p{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.01em}
[contenteditable]{outline:none;border-radius:8px;transition:box-shadow .15s,background .15s}
[contenteditable]:hover{box-shadow:0 0 0 1px var(--border)}
[contenteditable]:focus{box-shadow:0 0 0 2px var(--accent);background:var(--surface)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- cabeçalho ---------- */
.band{background:linear-gradient(135deg,#2f1c0d,#422a15);color:#fbf5e9;box-shadow:0 2px 10px rgba(47,28,13,.25)}
.band-in{max-width:1280px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;min-width:0}
.logo{width:44px;height:44px;border-radius:10px;background:#f3ede0;display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.logo img{width:34px;height:34px;display:block}
.bt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.bt b{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.01em}
.bt small{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#d9c7a6;white-space:nowrap}
.spacer{flex:1}
.band-in .mback,.band-in .mtitle,.band-in .bsearch,.band-in .bmore{display:none}
.ibtn{width:40px;height:40px;border-radius:8px;border:1px solid rgba(251,245,233,.18);background:rgba(251,245,233,.06);color:#fbf5e9;display:grid;place-items:center;flex:none}
.ibtn:hover{background:rgba(251,245,233,.14)}
.ibtn svg{width:20px;height:20px}
.search{position:relative;width:min(420px,40vw)}
.search input{width:100%;height:40px;border-radius:8px;border:1px solid rgba(251,245,233,.2);background:rgba(251,245,233,.08);color:#fbf5e9;padding:0 12px 0 38px;font:inherit;font-size:14px}
.search input::placeholder{color:#cdb894}
.search input:focus{outline:none;background:rgba(251,245,233,.14);border-color:#d9832f}
.search .sic{position:absolute;left:11px;top:10px;width:20px;height:20px;color:#cdb894;pointer-events:none}
.sres{position:absolute;left:0;right:0;top:46px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;box-shadow:0 14px 40px rgba(47,28,13,.28);overflow:hidden;z-index:60;display:none;max-height:min(70vh,460px);overflow-y:auto}
.sres.open{display:block}
.sres a{display:flex;gap:10px;align-items:center;padding:10px 14px;text-decoration:none;border-bottom:1px solid var(--border);min-height:48px}
.sres a:last-child{border-bottom:0}
.sres a.act,.sres a:hover{background:var(--hover)}
.sres .sc{font-weight:700;font-size:13.5px;flex:none;min-width:70px}
.sres .sd{flex:1;min-width:0;font-size:13px}
.sres .sd small{display:block;color:var(--muted);font-size:11.5px}
.sres .sv{font-size:12.5px;color:var(--soft);flex:none}
.sres .empty{padding:14px;color:var(--muted);font-size:13.5px}

/* ---------- conteúdo ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:22px 24px 48px}
.titlerow{display:flex;align-items:flex-end;gap:20px;justify-content:space-between;flex-wrap:wrap}
.titlerow h1{font-size:30px;line-height:1.15;padding:2px 6px;margin-left:-6px}
.sub{margin:6px 0 0;color:var(--soft);font-size:13.5px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--brass)}
.btn.primary{background:linear-gradient(180deg,#6b4423,#422a15);color:#fbf5e9;border-color:#422a15}
.btn.primary:hover{filter:brightness(1.12)}
.btn svg{width:17px;height:17px}

.filters{margin-top:18px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.frow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.flab{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);width:62px;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;color:var(--soft)}
.chip:hover{border-color:var(--brass);color:var(--text)}
.chip.on{background:var(--leather-d);border-color:var(--leather-d);color:#fbf5e9}
:root[data-theme="dark"] .chip.on{background:var(--accent);border-color:var(--accent);color:#1c1409}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{background:var(--accent);border-color:var(--accent);color:#1c1409}}
.chip .dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 0 1.5px rgba(255,255,255,.7)}
.months{display:flex;gap:4px;flex-wrap:wrap}
.mchip{height:34px;min-width:58px;padding:0 6px;border:1px solid var(--border);background:var(--surface);border-radius:8px;font-size:12.5px;color:var(--soft)}
.mchip.in{background:var(--surface2);color:var(--text);border-color:var(--brass)}
.mchip.edge{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.hint{font-size:12.5px;color:var(--muted)}
.fbtn{display:none}

.crumbs{margin:20px 0 4px;display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:13.5px}
.crumbs a{text-decoration:none;color:var(--soft);padding:4px 8px;border-radius:8px;font-weight:500}
.crumbs a:hover{background:var(--surface2);color:var(--text)}
.crumbs .sep{color:var(--border);font-size:16px}
.crumbs .cur{padding:4px 8px;font-weight:700;color:var(--text)}

.lhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:6px 0 16px;flex-wrap:wrap}
.over{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.lhead h2{font-size:28px;line-height:1.15;margin-top:2px}
.lhead h2 .desc{font-weight:500;color:var(--soft)}
.lmeta{color:var(--soft);font-size:13.5px;margin-top:4px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.kpi:first-child{background:linear-gradient(160deg,#6b4423,#422a15);border-color:#422a15;color:#fbf5e9}
.kpi:first-child .kl,.kpi:first-child .ks{color:#e0cca8}
.kl{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);display:block}
.kv{font-family:var(--serif);font-size:26px;font-weight:600;display:block;margin-top:4px;line-height:1.1;letter-spacing:-.01em;white-space:nowrap}
.ks{font-size:12.5px;color:var(--soft);display:block;margin-top:4px}

.grid2{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.grid2.eq{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.card+.card{margin-top:0}
.stackc>.card{margin-bottom:16px}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.chead h3{font-size:18px}
.chead .cnote{font-size:12.5px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface2);padding:2px;gap:2px}
.seg button{border:0;background:transparent;height:30px;padding:0 12px;border-radius:6px;font-size:13px;font-weight:600;color:var(--soft)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(66,42,21,.18)}

/* gráfico mensal */
.chart{position:relative;height:250px;padding-left:52px;padding-top:18px}
.gl{position:absolute;left:52px;right:0;border-top:1px dashed var(--border)}
.gl.zero{border-top:1px solid var(--border)}
.gl span{position:absolute;right:calc(100% + 8px);top:-8px;font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.bars{position:absolute;left:52px;right:0;top:18px;bottom:0;display:flex;gap:6px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
.bar{background:var(--accent);border-radius:5px 5px 0 0;min-height:2px;transition:height .35s ease,background .15s;position:relative}
.col:hover .bar,.col.hl .bar{background:var(--accent-h)}
.col.parc .bar{background:repeating-linear-gradient(135deg,var(--accent) 0 6px,var(--accent-h) 6px 12px);opacity:.75}
.col.parc .xl small{color:var(--accent);font-weight:600}
.col.mx .bar{background:var(--leather-d)}
:root[data-theme="dark"] .col.mx .bar{background:var(--brass)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .col.mx .bar{background:var(--brass)}}
.bv{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--soft);white-space:nowrap;padding-bottom:3px;font-variant-numeric:tabular-nums}
.xl{height:34px;text-align:center;font-size:11.5px;color:var(--soft);padding-top:6px;line-height:1.1}
.xl small{display:block;font-size:10px;color:var(--muted)}
.chartwrap{padding-bottom:0}

/* canais */
.stack{display:flex;height:26px;border-radius:8px;overflow:hidden;background:var(--track);margin:4px 0 14px}
.stack i{display:block;height:100%;min-width:2px}
.stack i+i{box-shadow:inset 2px 0 0 var(--surface)}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.legend li{display:grid;grid-template-columns:14px minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.legend li:last-child{border-bottom:0}
.legend .dot{width:12px;height:12px;border-radius:4px}
.legend .leg-n{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .leg-n small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.legend .leg-v{font-weight:600;text-align:right}
.legend .leg-p{color:var(--soft);text-align:right;min-width:48px}
.legend li.zero{opacity:.45}

/* destaques */
.dest{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:12px;box-shadow:var(--shadow);padding:16px 20px;margin-bottom:16px}
.dest .chead{margin-bottom:6px}
.destbody ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px 24px}
.destbody li{padding:8px 0 8px 22px;position:relative;font-size:14px;border-bottom:1px dashed var(--border)}
.destbody li::before{content:"";position:absolute;left:4px;top:15px;width:8px;height:8px;border-radius:2px;background:var(--brass);transform:rotate(45deg)}
.destbody b{font-weight:700}
.destbody .up{color:var(--ok);font-weight:700}
.destbody .down{color:var(--bad);font-weight:700}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:12.5px;padding:4px 0}
.edtag{font-size:11.5px;color:var(--muted)}

/* lista */
.lcard{padding:0;overflow:hidden}
.lcard .chead{padding:14px 18px 10px;margin:0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--surface2);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer;transition:background .12s}
.tbl tbody tr:hover{background:var(--hover)}
.tbl .n{text-align:right;white-space:nowrap}
.tbl td.nm a{text-decoration:none;font-weight:600}
.tbl td.nm .rk{color:var(--muted);font-size:12px;width:22px;display:inline-block;font-variant-numeric:tabular-nums}
.tbl td.nm .ds{display:block;font-weight:400;color:var(--soft);font-size:12.5px;margin-left:22px}
.tbl td.pb{width:24%}
.tbl .go{width:28px;color:var(--muted);text-align:right}
.pbar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.cards{display:none}
.more{display:flex;justify-content:center;padding:14px;border-top:1px solid var(--border)}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}

/* barras horizontais (cor) e colunas (tamanho) */
.hb{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;font-size:13.5px}
.hn{display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{width:14px;height:14px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.sw.none{background:repeating-linear-gradient(45deg,var(--surface2) 0 3px,var(--border) 3px 6px)}
.ht{height:12px;background:var(--track);border-radius:99px;overflow:hidden}
.ht i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hv{color:var(--soft);font-size:12.5px;white-space:nowrap;text-align:right;min-width:86px}
.hv b{color:var(--text)}
.foot{font-size:12.5px;color:var(--muted);margin-top:8px}
.vcols{display:flex;justify-content:center;align-items:flex-end;gap:8px;height:190px;padding-top:22px}
.vc{flex:1;max-width:96px;min-width:0;display:flex;flex-direction:column;height:100%}
.vc .bw{flex:1}
.vc .bar{background:var(--brass);border-radius:5px 5px 0 0}
.vc .bv{color:var(--text);font-weight:600}
.vc .xl{height:24px;font-weight:600;color:var(--text)}

/* comentários */
.cmt{margin-top:16px}
.cmtbox{min-height:84px;padding:12px 14px;border:1px dashed var(--border);border-radius:8px;white-space:pre-wrap;font-size:14.5px;background:var(--bg)}
.cmtbox:empty::before{content:attr(data-ph);color:var(--muted)}
.cmtnote{font-size:12px;color:var(--muted);margin-top:6px}

footer.ft{margin-top:28px;padding-top:16px;border-top:1px solid var(--border);color:var(--muted);font-size:12.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* tooltip */
.tip{position:fixed;z-index:90;pointer-events:none;background:#2f1c0d;color:#fbf5e9;border-radius:8px;padding:9px 12px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;min-width:150px;font-variant-numeric:tabular-nums}
.tip.on{opacity:1;transform:none}
.tip b{font-family:var(--serif);font-size:14px;display:block;margin-bottom:3px}
.tip span{display:flex;justify-content:space-between;gap:16px;color:#e8d8bb}
.tip span em{font-style:normal;color:#fbf5e9;font-weight:600}

/* folhas (celular) */
.scrim{position:fixed;inset:0;background:rgba(28,20,9,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:70}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s linear .26s;position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:var(--shadow-l);transform:translateY(105%);max-height:88vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s}
.sgrab{width:44px;height:5px;border-radius:99px;background:var(--border);margin:10px auto 4px}
.shead{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 10px}
.shead h3{font-size:20px}
.sbody{overflow-y:auto;padding:4px 18px 16px}
.sbody .frow{flex-direction:column;align-items:flex-start;gap:8px;margin-bottom:14px}
.sbody .flab{width:auto}
.sfoot{padding:12px 18px 16px;border-top:1px solid var(--border)}
.sfoot .btn{width:100%;justify-content:center;height:48px;font-size:15px}
.mlist button{width:100%;display:flex;align-items:center;gap:12px;min-height:52px;border:0;border-bottom:1px solid var(--border);background:none;text-align:left;font-size:15.5px;font-weight:500;padding:0 4px}
.mlist button:last-child{border-bottom:0}
.mlist svg{width:20px;height:20px;color:var(--accent)}
.xbtn{width:40px;height:40px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center}

/* ================= CELULAR ================= */
@media (max-width:759.98px){
  body{font-size:15px}
  .band{position:sticky;top:0;z-index:50}
  .band-in{padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));gap:8px;flex-wrap:nowrap}
  .band.searching .band-in{flex-wrap:wrap}
  .brand.home{flex:1;min-width:0}
  .bt small{overflow:hidden;text-overflow:ellipsis}
  .band-in .mback{display:grid}
  .band-in .mback[hidden]{display:none}
  .brand .bt{display:none}
  .brand.home .bt{display:flex}
  .brand.home .bt b{font-size:18px}
  .brand.home .bt small{font-size:8.5px;letter-spacing:.05em}
  .logo{width:38px;height:38px;border-radius:9px}
  .logo img{width:30px;height:30px}
  .band-in .mtitle{display:flex;flex-direction:column;flex:1;min-width:0;line-height:1.15}
  .mtitle small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#d9c7a6}
  .mtitle b{font-family:var(--serif);font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .band-in .brand.home + .mtitle{display:none}
  .spacer{display:none}
  .brand.home ~ .spacer{display:block}
  .band-in .bsearch,.band-in .bmore{display:grid}
  .band-in .btheme{display:none}
  .ibtn{width:44px;height:44px}
  .search{display:none;width:100%;order:10}
  .band.searching .search{display:block}
  .search input{height:44px;font-size:16px}
  .sres{top:50px;position:fixed;left:10px;right:10px;max-height:70vh}
  .wrap{padding:14px 14px 40px}
  .titlerow{display:block}
  .titlerow h1{font-size:22px}
  .sub{font-size:12.5px}
  .actions{display:none}
  .filters{display:none}
  .fbtn{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;min-height:52px;padding:8px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow);text-align:left}
  .fbtn svg{width:20px;height:20px;color:var(--accent);flex:none}
  .fbtn .ft1{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
  .fbtn .ft1 b{font-size:14px}
  .fbtn .ft1 small{font-size:12.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fbtn .fgo{font-size:13px;font-weight:600;color:var(--accent)}
  .chip{height:42px;padding:0 15px;font-size:14px}
  .mchip{height:42px;min-width:0;flex:1 0 calc(25% - 4px)}
  .months{width:100%}
  .crumbs{margin:14px 0 2px;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch;font-size:13px}
  .crumbs::-webkit-scrollbar{display:none}
  .crumbs a,.crumbs .cur{padding:8px 6px}
  .lhead{margin:2px 0 12px}
  .lhead h2{font-size:23px}
  .lhead h2 .desc{display:block;font-size:16px}
  .kpis{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 14px;gap:10px;margin:0 -14px 14px;padding:2px 14px 8px;scrollbar-width:none}
  .kpis::-webkit-scrollbar{display:none}
  .kpi{flex:0 0 auto;width:min(46vw,190px);scroll-snap-align:start;padding:12px 14px}
  .kv{font-size:22px}
  .grid2,.grid2.eq{grid-template-columns:minmax(0,1fr);gap:14px;margin-bottom:14px}
  .card{padding:14px}
  .chart{height:210px;padding-left:40px}
  .gl{left:40px}
  .bars{left:40px;gap:3px}
  .gl span{font-size:10px}
  .bv{display:none}
  .xl{font-size:10.5px}
  .xl small{font-size:9px}
  .destbody ul{grid-template-columns:minmax(0,1fr)}
  .dest{padding:14px 16px}
  .tbl{display:none}
  .cards{display:flex;flex-direction:column;gap:10px;padding:4px 12px 12px}
  .item{display:block;text-decoration:none;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px 14px;min-height:44px;-webkit-tap-highlight-color:transparent;transition:transform .1s}
  .item:active{transform:scale(.985);background:var(--hover)}
  .it1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .it1 .nm{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .it1 .nm small{display:block;font-weight:400;color:var(--soft);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it1 .val{font-family:var(--serif);font-size:19px;font-weight:600;white-space:nowrap}
  .item .pbar{margin:9px 0 8px}
  .it2{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums}
  .it2 b{color:var(--text)}
  .lcard .chead{padding:12px 14px 8px}
  .hb{grid-template-columns:minmax(0,128px) minmax(0,1fr) auto;gap:8px}
  .hv{min-width:0;font-size:12px}
  .vcols{gap:4px}
  .vc .bv{display:block;font-size:10px}
  footer.ft{flex-direction:column}
  .more .btn{width:100%;justify-content:center;height:48px}
}
@media (min-width:760px){ .sheet,.scrim{display:none} }

/* ================= IMPRESSÃO ================= */
@media print{
  :root,:root[data-theme="dark"]{--bg:#fff;--surface:#fff;--surface2:#f3ede0;--text:#2a1d10;--soft:#4b3f33;--muted:#6b5d4d;--border:#d5c7a8;--accent:#b5651d;--track:#efe6d2;--brass:#9c7a3c;--leather-d:#422a15;--c0:#c4661c;--c1:#2f74b0;--c2:#5d8a2f;--c3:#a0438f;--c4:#b88a1f;--shadow:none;color-scheme:light}
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:11.5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .band{background:#fff!important;color:#2a1d10;box-shadow:none;border-bottom:2px solid #422a15;position:static}
  .band-in{padding:0 0 8px}
  .bt small{color:#6b5d4d}
  .brand .bt{display:flex!important}
  .search,.ibtn,.mtitle,.no-print,.fbtn,.sheet,.scrim,.tip,.linkbtn,.more,.seg,.cmtnote{display:none!important}
  .wrap{padding:10px 0 0;max-width:none}
  .titlerow h1{font-size:22px}
  .printf{display:block!important}
  .kpis{display:grid!important;grid-template-columns:repeat(3,1fr);margin:0 0 10px;padding:0}
  .kpi{width:auto;box-shadow:none;break-inside:avoid}
  .kpi:first-child{background:#fff;color:#2a1d10;border-color:#d5c7a8}
  .kpi:first-child .kl,.kpi:first-child .ks{color:#6b5d4d}
  .kv{font-size:18px}
  .grid2,.grid2.eq{grid-template-columns:1.6fr 1fr!important;gap:10px}
  .card,.dest{box-shadow:none;break-inside:avoid}
  .lcard{break-inside:auto}
  .tbl{display:table!important;font-size:10.5px}
  .tbl tr{break-inside:avoid}
  .cards{display:none!important}
  .chart{height:190px}
  .bv{display:block!important}
  [contenteditable]{box-shadow:none!important}
  .cmtbox{background:#fff;border-style:solid}
  .cmtbox:empty{display:none}
  .cmt:has(.cmtbox:empty){display:none}
  .crumbs{margin-top:6px}
  .crumbs a{color:#4b3f33}
}
.printf{display:none;font-size:11px;color:var(--soft);margin-top:4px}
/* ===== Dentro do HBN Hub (iframe): o Hub já mostra a marca e o tema ===== */
html[data-embed] .band{position:sticky;top:0;z-index:50}
html[data-embed] .band-in .brand,html[data-embed] .band-in .btheme,html[data-embed] .band-in .spacer,html[data-embed] #mtheme{display:none!important}
html[data-embed] .band-in .mtitle{display:flex!important;flex-direction:column;flex:1;min-width:0;line-height:1.15}
html[data-embed] .mtitle small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#d9c7a6}
html[data-embed] .mtitle b{font-family:var(--serif);font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-embed] .band-in{padding-top:10px;padding-bottom:10px}
@media print{html[data-embed] .band{display:none}}
</style>

<script>
(function(){
"use strict";
/* Cópia do arquivo original — usada por "Salvar versão editada". Capturada antes de qualquer alteração na tela. */
var SRC='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
var EMBED=document.documentElement.hasAttribute('data-embed');
var LSK='hbn-relatorio-vendas-edicoes';
var D=JSON.parse(document.getElementById('data').textContent);
var E={};try{E=JSON.parse(document.getElementById('edits').textContent||'{}')||{}}catch(e){E={}}
var dirty=false;
/* Dentro do Hub, os textos editados ficam guardados neste navegador (não se perdem ao trocar de tela). */
if(EMBED&&!Object.keys(E).length){try{var ls=JSON.parse(localStorage.getItem(LSK+':v1')||'null');if(ls&&typeof ls==='object')E=ls}catch(e){}}
function markDirty(){dirty=true;if(EMBED){try{localStorage.setItem(LSK+':v1',JSON.stringify(E))}catch(e){}}}

/* ---------- formatação pt-BR ---------- */
var nf0=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});
var nf1=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
var nf2=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function R(v){return (v<0?'−':'')+'R$ '+nf2.format(Math.abs(v))}
function RA(v){var a=Math.abs(v),s=v<0?'−':'';if(a>=1e6)return s+'R$ '+nf2.format(a/1e6)+' mi';if(a>=1e4)return s+'R$ '+nf1.format(a/1e3)+' mil';return R(v)}
function SH(v,money){var a=Math.abs(v),p=money?'R$ ':'';if(a>=1e6)return p+nf1.format(v/1e6)+' mi';if(a>=1e3)return p+nf0.format(v/1e3)+' mil';return p+nf0.format(v)}
function N(v){return nf0.format(v)}
function P(x){return isFinite(x)?nf1.format(x*100)+'%':'—'}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
var MESL=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function mlab(i){var p=D.months[i].split('-');return MES[+p[1]-1]+'/'+p[0].slice(2)}
function mparts(i){var p=D.months[i].split('-');return [MES[+p[1]-1],p[0].slice(2),MESL[+p[1]-1]+' de '+p[0]]}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function norm(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
var CH_SHORT=['Shopee / ML','TikTok Shop','Shein','Atacado','Consumidor final'];

/* ---------- índices ---------- */
var NM=D.months.length,NC=D.canais.length;
/* Mês em andamento (relatório automático do Hub): fica de fora de "pior mês" e da comparação dos últimos 3 meses. */
var PARC=(D.auto&&D.auto.mesParcial)?D.months.indexOf(D.auto.mesParcial):-1;
var subG=D.subs.map(function(s){return s[0]});
var refS=D.refs.map(function(r){return r[2]});
var refG=refS.map(function(s){return subG[s]});
var cBy={},tBy={};
D.c.forEach(function(r){(cBy[r[0]]||(cBy[r[0]]=[])).push(r)});
D.t.forEach(function(r){(tBy[r[0]]||(tBy[r[0]]=[])).push(r)});
var SZ=['PP','P','M','G','GG','EG','EGG','XG','XGG','G1','G2','G3','G4','G5','U'];
function szRank(s){var k=SZ.indexOf(s);if(k>=0)return k;if(/^\d+$/.test(s))return 100+(+s);return 50}
var SW={'PRETO':'#151210','JET BLACK':'#0d0d0d','BRANCO':'#ffffff','OFF WHITE':'#f3ede0','OFF':'#f3ede0','MARFIM':'#efe6cf','MARFIN':'#efe6cf','AZUL MARINHO':'#1f2a44','BEGE':'#d6c19c','BEGE CLARO':'#e6d7b8','BEGE ESCURO':'#b89c70','MARRON CAFE':'#4a2f1f','MARRON':'#6b4423','MARROM':'#6b4423','MARSALA':'#7b2d3a','VERMELHO':'#b3261e','VERMELHO CEREJA':'#9e1b2c','VERDE MILITAR':'#4b5320','AZUL BEBE':'#a9c9e8','VERDE':'#2e7d32','CHOCOLATE':'#5a3825','GRAFITE':'#4a4a4a','CHUMBO':'#3e3e3e','JEANS':'#3b5b85','JEANS CLARO':'#7b9cc4','JEANS ESCURO':'#24395a','AZUL JEANS':'#4a6fa5','ROSA BEBE':'#f2c4cf','TERRA COTA':'#b5651d','AMARELO':'#e5b72a','FUCSIA':'#c2185b','CINZA':'#8a8a8a','CINZA CLARO':'#c4c4c4','MESCLA':'#a3a3a3','MESCLA ESCURO':'#666','AZUL ROYAL':'#2541b2','AZUL':'#2f5fa8','AZUL CLARO':'#8fb8de','AZUL ESCURO':'#1c2f5a','AZUL PETROLEO':'#1d4e59','PETROLEO':'#1d4e59','VERDE MUSGO':'#5a6b2f','VERDE OLIVA':'#6b6b2f','VERDE ESCURO':'#1f4d2b','VERDE BANDEIRA':'#00843d','VERDE CLARO':'#8fcf8f','VERDE AGUA':'#7fd1c1','VINHO':'#5e1a2a','BORDO':'#6d1f2f','ROSA':'#e48aa5','ROSA PINK':'#e0457b','CARAMELO':'#a86a2d','NUDE':'#d9b49a','LILAS':'#b39ddb','ROXO':'#6a3d9a','LARANJA':'#e07020','MOSTARDA':'#c9a227','TELHA':'#b5502e','TIJOLO':'#9c3d22','COBRE':'#b87333','CANELA':'#9b5b2f','KAKI':'#b5a77a','CAQUI':'#b5a77a','AREIA':'#d8c7a3','TABACO':'#6e4b2a','FERRUGEM':'#9a4a1c','DOURADO':'#c9a33a','PRATA':'#b8b8b8','SALMOM':'#f08a6e','MENTA':'#9fdcc0','PISTACHE':'#a9c47f'};
function swatch(n){var c=SW[n];return c?'<i class="sw" style="background:'+c+'"></i>':'<i class="sw none"></i>'}

/* ---------- estado ---------- */
var S={a:0,b:NM-1,ch:[1,1,1,1,1],custom:false,pick:null,sort:'fat',all:false,mode:'rs',sortRef:false};
var PRE=[{k:'full',l:'Ago/25–Set/26 (completo)',a:0,b:NM-1},{k:'12',l:'Últimos 12 meses',a:NM-12,b:NM-1},{k:'6',l:'Últimos 6',a:NM-6,b:NM-1},{k:'3',l:'Últimos 3',a:NM-3,b:NM-1}];
PRE[0].l=cap(mlab(0))+'–'+cap(mlab(NM-1))+' (completo)';
function activePre(){if(S.custom)return 'custom';for(var i=0;i<PRE.length;i++)if(PRE[i].a===S.a&&PRE[i].b===S.b)return PRE[i].k;return 'custom'}
function perLabel(){return S.a===S.b?mlab(S.a):mlab(S.a)+' – '+mlab(S.b)}
function chOn(){var n=0;S.ch.forEach(function(v){n+=v});return n}
function chLabel(){if(chOn()===NC)return 'Todos os canais';return CH_SHORT.filter(function(_,i){return S.ch[i]}).join(', ')}

/* ---------- rota (#hash) ---------- */
function parse(){
  var h=location.hash.replace(/^#\/?/,'').split('/');
  var t=h[0],id=parseInt(h[1],10);
  if(t==='g'&&id>=0&&id<D.grupos.length)return {t:'g',id:id};
  if(t==='s'&&id>=0&&id<D.subs.length)return {t:'s',id:id};
  if(t==='r'&&id>=0&&id<D.refs.length)return {t:'r',id:id};
  return {t:'geral'};
}
function parentHash(L){if(L.t==='r')return '#/s/'+refS[L.id];if(L.t==='s')return '#/g/'+subG[L.id];return '#/'}
var navStack=[location.hash||'#/'];
function go(h){if(location.hash===h)return;location.hash=h}

/* ---------- cálculo ---------- */
function blank(){return {fat:0,pcs:0,cost:0,fatC:0,costC:0}}
function add(o,r){o.fat+=r[4];o.pcs+=r[3];o.cost+=r[5];if(r[5]>0){o.fatC+=r[4];o.costC+=r[5]}}
function compute(L){
  var a=S.a,b=S.b,ch=S.ch,T=blank(),X=blank(),mon=[],chn=[],kids={},refAll={},i;
  for(i=0;i<NM;i++)mon.push(blank());for(i=0;i<NC;i++)chn.push(blank());
  var f=D.f;
  for(i=0;i<f.length;i++){
    var r=f[i];if(r[1]<a||r[1]>b||!ch[r[2]])continue;
    add(T,r);var ri=r[0];
    if(L.t==='geral'){(refAll[ri]||(refAll[ri]=blank()));add(refAll[ri],r)}
    else if(L.t==='g'){if(refG[ri]!==L.id)continue}
    else if(L.t==='s'){if(refS[ri]!==L.id)continue}
    else if(ri!==L.id)continue;
    add(X,r);add(mon[r[1]],r);add(chn[r[2]],r);
    var k=L.t==='geral'?refG[ri]:L.t==='g'?refS[ri]:L.t==='s'?ri:null;
    if(k!==null){(kids[k]||(kids[k]=blank()));add(kids[k],r)}
  }
  var orders=0;
  if(L.t==='geral')D.o.forEach(function(o){if(o[0]>=a&&o[0]<=b&&ch[o[1]])orders+=o[2]});
  var list=Object.keys(kids).map(function(k){var o=kids[k];o.id=+k;return o}).filter(function(o){return o.pcs!==0||Math.abs(o.fat)>0.004});
  return {T:T,X:X,mon:mon,chn:chn,list:list,orders:orders,refAll:refAll};
}
function margin(o){return o.fatC>0?(o.fatC-o.costC)/o.fatC:NaN}

/* ---------- render: filtros ---------- */
function filtersHTML(){
  var ap=activePre(),h='<div class="frow"><span class="flab">Período</span><div class="chips">';
  PRE.forEach(function(p){h+='<button class="chip'+(ap===p.k?' on':'')+'" data-p="'+p.k+'">'+p.l+'</button>'});
  h+='<button class="chip'+(ap==='custom'?' on':'')+'" data-p="custom">Personalizar</button></div></div>';
  if(ap==='custom'){
    h+='<div class="frow"><span class="flab">Meses</span><div class="months">';
    for(var i=0;i<NM;i++){var mp=mparts(i),cls='mchip';if(i>=S.a&&i<=S.b)cls+=' in';if(i===S.a||i===S.b)cls+=' edge';h+='<button class="'+cls+'" data-m="'+i+'">'+mp[0]+'/'+mp[1]+'</button>'}
    h+='</div><span class="hint">'+(S.pick===null?'Toque no mês inicial e depois no mês final.':'Agora toque no mês final.')+'</span></div>';
  }
  h+='<div class="frow"><span class="flab">Canal</span><div class="chips"><button class="chip'+(chOn()===NC?' on':'')+'" data-ch="all">Todos</button>';
  D.canais.forEach(function(c,i){h+='<button class="chip'+(S.ch[i]&&chOn()<NC?' on':'')+'" data-ch="'+i+'"><span class="dot" style="background:var(--c'+i+')"></span>'+esc(c)+'</button>'});
  h+='</div></div>';return h;
}
function renderFilters(){
  var h=filtersHTML();
  document.getElementById('filtersDesk').innerHTML=h;
  document.getElementById('filtersSheet').innerHTML=h;
  document.getElementById('fbtn').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span class="ft1"><b>'+perLabel()+'</b><small>'+esc(chLabel())+'</small></span><span class="fgo">Filtrar</span>';
  document.getElementById('sub').textContent='Período: '+perLabel()+' · '+chLabel()+' · Fonte: '+D.fonte;
  document.getElementById('printf').textContent='Filtro aplicado: '+perLabel()+' · '+chLabel()+' · Gerado em '+fmtDate(D.geradoEm);
}
function fmtDate(s){var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]}

/* ---------- render: blocos ---------- */
function kpi(l,v,s,t){return '<div class="kpi"'+(t?' title="'+esc(t)+'"':'')+'><span class="kl">'+l+'</span><b class="kv">'+v+'</b>'+(s?'<span class="ks">'+s+'</span>':'')+'</div>'}
function kpisHTML(L,C){
  var X=C.X,pm=X.pcs?X.fat/X.pcs:NaN,m=margin(X),cov=X.fat>0?X.fatC/X.fat:0;
  var mS=isFinite(m)?(cov<0.995?'sobre '+P(cov)+' do fat. com custo cadastrado':'sobre todo o faturamento'):'sem custo cadastrado no Wik';
  var h='<div class="kpis">';
  h+=kpi('Faturamento',RA(X.fat),R(X.fat));
  h+=kpi('Peças',N(X.pcs),'vendidas no período');
  h+=kpi('Preço médio',isFinite(pm)?R(pm):'—','por peça');
  h+=kpi('Margem bruta',isFinite(m)?P(m):'—',mS,'Margem = (faturamento − custo) ÷ faturamento, só nos itens com custo cadastrado no Wik.'+(cov<0.995&&X.fat>0?' Sem custo: '+R(X.fat-X.fatC)+'.':''));
  if(L.t==='geral'){
    h+=kpi('Pedidos',N(C.orders),'pedidos de venda');
    h+=kpi('Ticket médio',C.orders?R(X.fat/C.orders):'—','faturamento ÷ pedidos');
  }else{
    h+=kpi('Participação no total',P(C.T.fat?X.fat/C.T.fat:NaN),'de '+RA(C.T.fat)+' no filtro');
  }
  return h+'</div>';
}
function niceMax(v){if(v<=0)return 1;var p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function monthHTML(C){
  var rs=S.mode==='rs',vals=[],i,mx=0,best=-1,bv=-Infinity;
  for(i=S.a;i<=S.b;i++){var v=rs?C.mon[i].fat:C.mon[i].pcs;vals.push(v);if(v>mx)mx=v;if(v>bv){bv=v;best=i}}
  var top=niceMax(mx),h='<div class="card chartwrap"><div class="chead"><h3>Evolução mês a mês</h3><div class="seg" role="group" aria-label="Medida"><button data-mode="rs" class="'+(rs?'on':'')+'">R$</button><button data-mode="pc" class="'+(!rs?'on':'')+'">Peças</button></div></div><div class="chart" id="mchart">';
  for(var g=0;g<=4;g++){var y=g/4;h+='<div class="gl'+(g===0?' zero':'')+'" style="bottom:calc(34px + '+y+' * (100% - 52px))"><span>'+SH(top*y,rs)+'</span></div>'}
  h+='<div class="bars">';
  for(i=S.a;i<=S.b;i++){
    var v2=vals[i-S.a],ht=Math.max(0,v2)/top*100,mp=mparts(i);
    h+='<div class="col'+(i===best&&S.b>S.a?' mx':'')+(i===PARC?' parc':'')+'" data-mi="'+i+'"><div class="bw"><div class="bar" style="height:'+ht.toFixed(2)+'%">'+(v2>0?'<span class="bv">'+SH(v2,false)+'</span>':'')+'</div></div><div class="xl">'+mp[0]+'<small>'+(i===PARC?'parcial':mp[1])+'</small></div></div>';
  }
  h+='</div></div></div>';return h;
}
function chanHTML(C,title){
  var X=C.X,tot=0,h;C.chn.forEach(function(o){tot+=Math.max(0,o.fat)});
  h='<div class="card"><div class="chead"><h3>'+(title||'Por canal de venda')+'</h3></div><div class="stack" role="img" aria-label="Divisão do faturamento por canal">';
  C.chn.forEach(function(o,i){if(o.fat>0&&tot>0)h+='<i style="width:'+(o.fat/tot*100).toFixed(3)+'%;background:var(--c'+i+')" title="'+esc(D.canais[i])+': '+P(o.fat/tot)+'"></i>'});
  h+='</div><ul class="legend">';
  var ord=C.chn.map(function(o,i){return {o:o,i:i}}).sort(function(x,y){return y.o.fat-x.o.fat});
  ord.forEach(function(e){var o=e.o,i=e.i;if(!S.ch[i])return;h+='<li class="'+(o.pcs===0&&o.fat===0?'zero':'')+'"><span class="dot" style="background:var(--c'+i+')"></span><span class="leg-n">'+esc(D.canais[i])+'<small>'+N(o.pcs)+' peças</small></span><span class="leg-v">'+RA(o.fat)+'</span><span class="leg-p">'+(tot>0?P(Math.max(0,o.fat)/tot):'—')+'</span></li>'});
  return h+'</ul></div>';
}
function kidName(L,id){
  if(L.t==='geral')return {h:'#/g/'+id,n:D.grupos[id],d:''};
  if(L.t==='g')return {h:'#/s/'+id,n:D.subs[id][1],d:''};
  var r=D.refs[id];return {h:'#/r/'+id,n:r[0],d:r[1]};
}
function listHTML(L,C){
  var X=C.X,list=C.list.slice(),key=S.sort==='pcs'?'pcs':'fat';
  list.sort(function(x,y){return y[key]-x[key]||y.fat-x.fat});
  var lbl=L.t==='geral'?['Grupos','Grupo','% do total']:L.t==='g'?['Subgrupos','Subgrupo','% do grupo']:['Referências','Referência','% do subgrupo'];
  var h='<div class="card lcard"><div class="chead"><h3>'+lbl[0]+' <span class="cnote">('+list.length+')</span></h3><div class="seg" role="group" aria-label="Ordenar por"><button data-sort="fat" class="'+(key==='fat'?'on':'')+'">Faturamento</button><button data-sort="pcs" class="'+(key==='pcs'?'on':'')+'">Peças</button></div></div>';
  if(!list.length)return h+'<div class="empty">Sem vendas com este filtro.</div></div>';
  var lim=(L.t==='s'&&!S.all)?Math.min(30,list.length):list.length,mxv=0;list.forEach(function(o){if(o[key]>mxv)mxv=o[key]});
  h+='<table class="tbl"><thead><tr><th>'+lbl[1]+'</th><th>Participação</th><th class="n">Peças</th><th class="n">Faturamento</th><th class="n">'+lbl[2]+'</th><th class="n">Preço médio</th><th class="go"></th></tr></thead><tbody>';
  var cards='';
  for(var i=0;i<lim;i++){
    var o=list[i],k=kidName(L,o.id),sh=X.fat?o.fat/X.fat:0,w=mxv>0?Math.max(0,o[key])/mxv*100:0,pm=o.pcs?o.fat/o.pcs:NaN;
    h+='<tr data-href="'+k.h+'"><td class="nm"><span class="rk">'+(i+1)+'</span><a href="'+k.h+'">'+esc(k.n)+'</a>'+(k.d?'<span class="ds">'+esc(k.d)+'</span>':'')+'</td><td class="pb"><div class="pbar"><i style="width:'+w.toFixed(2)+'%"></i></div></td><td class="n">'+N(o.pcs)+'</td><td class="n"><b>'+R(o.fat)+'</b></td><td class="n">'+P(sh)+'</td><td class="n">'+(isFinite(pm)?R(pm):'—')+'</td><td class="go">›</td></tr>';
    cards+='<a class="item" href="'+k.h+'"><div class="it1"><span class="nm">'+esc(k.n)+(k.d?'<small>'+esc(k.d)+'</small>':'')+'</span><b class="val">'+RA(o.fat)+'</b></div><div class="pbar"><i style="width:'+w.toFixed(2)+'%"></i></div><div class="it2"><span><b>'+N(o.pcs)+'</b> peças</span><span><b>'+P(sh)+'</b> '+(L.t==='geral'?'do total':'')+'</span><span>PM '+(isFinite(pm)?R(pm):'—')+'</span></div></a>';
  }
  h+='</tbody></table><div class="cards">'+cards+'</div>';
  if(lim<list.length)h+='<div class="more"><button class="btn" data-all>Ver todas as '+list.length+' referências</button></div>';
  else if(L.t==='s'&&list.length>30)h+='<div class="more"><button class="btn" data-all>Mostrar só as 30 primeiras</button></div>';
  return h+'</div>';
}
function commentHTML(key){
  var v=E['c_'+key]||'';
  return '<div class="card cmt"><div class="chead"><h3>Comentários</h3><span class="cnote no-print">Editável · vai junto ao salvar a versão editada</span></div><div class="cmtbox" contenteditable="true" data-ck="'+key+'" data-ph="Escreva aqui a sua análise deste nível antes de apresentar…">'+esc(v)+'</div></div>';
}

/* ---------- destaques (gerados dos dados) ---------- */
function destaques(C){
  var X=C.X,out=[];
  if(X.fat<=0)return '<ul><li>Sem vendas com este filtro.</li></ul>';
  var gl=C.list.slice().sort(function(x,y){return y.fat-x.fat})[0];
  if(gl)out.push('<b>'+esc(D.grupos[gl.id])+'</b> é o grupo líder, com <b>'+P(gl.fat/X.fat)+'</b> do faturamento ('+RA(gl.fat)+' · '+N(gl.pcs)+' peças).');
  var refs=Object.keys(C.refAll).map(function(k){var o=C.refAll[k];o.id=+k;return o}).filter(function(o){return o.fat>0});
  refs.sort(function(x,y){return y.fat-x.fat});
  var t10=0;refs.slice(0,10).forEach(function(o){t10+=o.fat});
  if(refs.length)out.push('As <b>10 maiores referências</b> concentram <b>'+P(t10/X.fat)+'</b> do faturamento ('+RA(t10)+'), num total de '+N(refs.length)+' referências vendidas. A líder é <b>'+esc(D.refs[refs[0].id][0])+'</b> ('+esc(D.refs[refs[0].id][1])+'), com '+RA(refs[0].fat)+'.');
  if(S.b>S.a){
    var bi=-1,wi=-1;for(var i=S.a;i<=S.b;i++){if(i===PARC)continue;if(bi<0||C.mon[i].fat>C.mon[bi].fat)bi=i;if(wi<0||C.mon[i].fat<C.mon[wi].fat)wi=i}
    if(bi>=0)out.push('Melhor mês: <b>'+mlab(bi)+'</b> ('+RA(C.mon[bi].fat)+' · '+N(C.mon[bi].pcs)+' peças). Pior mês: <b>'+mlab(wi)+'</b> ('+RA(C.mon[wi].fat)+').'+(PARC>=S.a&&PARC<=S.b?' <span class="edtag">('+mlab(PARC)+' ainda em andamento, fora da comparação)</span>':''));
  }
  /* últimos 3 meses vs 3 anteriores (termina no mês final do filtro, respeita os canais) */
  var e=S.b,eParc=false;if(e===PARC){e=e-1;eParc=true}
  if(e-5>=0){
    var A=0,B=0,f=D.f;for(var j=0;j<f.length;j++){var r=f[j];if(!S.ch[r[2]])continue;if(r[1]>=e-2&&r[1]<=e)A+=r[4];else if(r[1]>=e-5&&r[1]<=e-3)B+=r[4]}
    var d=B?(A-B)/B:NaN,cls=d>=0?'up':'down',sg=d>=0?'+':'−';
    out.push('Últimos 3 meses (<b>'+mlab(e-2)+'–'+mlab(e)+'</b>): '+RA(A)+' contra '+RA(B)+' nos 3 anteriores ('+mlab(e-5)+'–'+mlab(e-3)+'): <span class="'+cls+'">'+sg+nf1.format(Math.abs(d*100))+'%</span>.'+(S.b-S.a<5?' <span class="edtag">(inclui meses antes do período filtrado)</span>':'')+(eParc?' <span class="edtag">(sem '+mlab(PARC)+', ainda em andamento)</span>':''));
  }
  var cl=C.chn.map(function(o,i){return {o:o,i:i}}).filter(function(x){return S.ch[x.i]}).sort(function(x,y){return y.o.fat-x.o.fat})[0];
  if(cl&&chOn()>1)out.push('Canal líder: <b>'+esc(D.canais[cl.i])+'</b>, com <b>'+P(cl.o.fat/X.fat)+'</b> do faturamento ('+RA(cl.o.fat)+' · '+N(cl.o.pcs)+' peças).');
  else if(cl)out.push('Filtro em um único canal: <b>'+esc(D.canais[cl.i])+'</b>.');
  var m=margin(X),cov=X.fatC/X.fat;
  if(isFinite(m))out.push('Margem bruta de <b>'+P(m)+'</b> nos itens com custo cadastrado ('+P(cov)+' do faturamento). '+(cov<0.995?RA(X.fat-X.fatC)+' vendidos sem custo no Wik ficaram fora dessa conta.':''));
  return '<ul>'+out.map(function(s){return '<li>'+s+'</li>'}).join('')+'</ul>';
}
function sanitize(html){var t=document.createElement('template');t.innerHTML=html;t.content.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach(function(n){n.remove()});t.content.querySelectorAll('*').forEach(function(n){[].slice.call(n.attributes).forEach(function(a){if(/^on/i.test(a.name)||/javascript:/i.test(a.value))n.removeAttribute(a.name)})});return t.innerHTML}
function destHTML(C){
  var ed=typeof E.destaques==='string';
  return '<div class="dest"><div class="chead"><h3>Destaques</h3><span>'+(ed?'<span class="edtag">Texto editado por você · </span><button class="linkbtn no-print" data-regen>Recalcular a partir dos dados</button>':'<span class="edtag no-print">Gerado dos dados do filtro · clique no texto para editar</span>')+'</span></div><div class="destbody" contenteditable="true" id="destbody">'+(ed?sanitize(E.destaques):destaques(C))+'</div></div>';
}

/* ---------- detalhe da referência ---------- */
function refHTML(L,C){
  var id=L.id,a=S.a,b=S.b,col={},siz={},totC=0,totT=0,h='';
  (cBy[id]||[]).forEach(function(r){if(r[1]<a||r[1]>b||!S.ch[r[2]])return;col[r[3]]=(col[r[3]]||0)+r[4];totC+=r[4]});
  (tBy[id]||[]).forEach(function(r){if(r[1]<a||r[1]>b||!S.ch[r[2]])return;siz[r[3]]=(siz[r[3]]||0)+r[4];totT+=r[4]});
  var cl=Object.keys(col).map(function(k){return {n:D.cores[k],v:col[k]}}).sort(function(x,y){return y.v-x.v});
  var mx=cl.length?cl[0].v:0;
  h+='<div class="grid2 eq"><div class="card"><div class="chead"><h3>Peças por cor</h3><span class="cnote">'+(cl.length>10?'top 10 de '+cl.length+' cores':cl.length+' '+(cl.length===1?'cor':'cores'))+'</span></div>';
  if(!cl.length)h+='<div class="empty">Sem dados de cor neste filtro.</div>';
  cl.slice(0,10).forEach(function(o){h+='<div class="hb"><span class="hn">'+swatch(o.n)+esc(o.n)+'</span><span class="ht"><i style="width:'+(mx?Math.max(0,o.v)/mx*100:0).toFixed(2)+'%"></i></span><span class="hv"><b>'+N(o.v)+'</b> · '+P(totC?o.v/totC:NaN)+'</span></div>'});
  if(cl.length>10){var rest=0;cl.slice(10).forEach(function(o){rest+=o.v});h+='<div class="foot">Outras '+(cl.length-10)+' cores: '+N(rest)+' peças ('+P(rest/totC)+').</div>'}
  h+='</div>';
  var sl=Object.keys(siz).map(function(k){return {n:D.tams[k],v:siz[k]}}).sort(function(x,y){return szRank(x.n)-szRank(y.n)||(x.n<y.n?-1:1)});
  var mx2=0;sl.forEach(function(o){if(o.v>mx2)mx2=o.v});
  h+='<div class="card"><div class="chead"><h3>Peças por tamanho</h3><span class="cnote">'+N(totT)+' peças</span></div>';
  if(!sl.length)h+='<div class="empty">Sem dados de tamanho neste filtro.</div>';
  else{h+='<div class="vcols">';sl.forEach(function(o){h+='<div class="vc" title="'+esc(o.n)+': '+N(o.v)+' peças ('+P(totT?o.v/totT:NaN)+')"><div class="bw"><div class="bar" style="height:'+(mx2?Math.max(0,o.v)/mx2*100:0).toFixed(2)+'%"><span class="bv">'+N(o.v)+'</span></div></div><div class="xl">'+esc(o.n)+'</div></div>'});h+='</div><div class="foot">'+sl.map(function(o){return esc(o.n)+' '+P(totT?o.v/totT:NaN)}).join(' · ')+'</div>'}
  h+='</div></div>';
  return h;
}

/* ---------- render principal ---------- */
var L=parse(),C=null;
function levelInfo(L){
  if(L.t==='geral')return {over:'Visão geral',name:'Todos os grupos',short:'Visão geral'};
  if(L.t==='g')return {over:'Grupo',name:D.grupos[L.id],short:D.grupos[L.id]};
  if(L.t==='s')return {over:'Subgrupo · '+D.grupos[subG[L.id]],name:D.subs[L.id][1],short:D.subs[L.id][1]};
  var r=D.refs[L.id];return {over:'Referência',name:r[0],desc:r[1],short:r[0]};
}
function crumbsHTML(L){
  var p=[['#/','Geral']];
  if(L.t==='g')p.push(['#/g/'+L.id,D.grupos[L.id]]);
  if(L.t==='s'){p.push(['#/g/'+subG[L.id],D.grupos[subG[L.id]]]);p.push(['#/s/'+L.id,D.subs[L.id][1]])}
  if(L.t==='r'){var s=refS[L.id];p.push(['#/g/'+subG[s],D.grupos[subG[s]]]);p.push(['#/s/'+s,D.subs[s][1]]);p.push(['#/r/'+L.id,D.refs[L.id][0]])}
  return p.map(function(x,i){return i===p.length-1?'<span class="cur" aria-current="page">'+esc(x[1])+'</span>':'<a href="'+x[0]+'">'+esc(x[1])+'</a><span class="sep">›</span>'}).join('');
}
function render(){
  C=compute(L);
  renderFilters();
  var I=levelInfo(L),X=C.X,h='';
  document.getElementById('crumbs').innerHTML=crumbsHTML(L);
  var mt=document.getElementById('mtitle');mt.innerHTML='<small>'+esc(L.t==='geral'?'Relatório de vendas':I.over.split(' · ')[0])+'</small><b>'+esc(I.short)+'</b>';
  document.getElementById('mback').hidden=L.t==='geral';
  document.getElementById('brand').classList.toggle('home',L.t==='geral');
  var meta='';
  if(L.t==='geral'){var ng=C.list.length,nr=Object.keys(C.refAll).length;meta=ng+' grupos e '+N(nr)+' referências com venda no filtro'}
  else if(L.t==='g'){var rs={};D.f.forEach(function(r){if(r[1]>=S.a&&r[1]<=S.b&&S.ch[r[2]]&&refG[r[0]]===L.id)rs[r[0]]=1});meta=C.list.length+' subgrupos · '+Object.keys(rs).length+' referências com venda'}
  else if(L.t==='s')meta='Grupo '+D.grupos[subG[L.id]]+' · '+C.list.length+' referências com venda';
  else{var rr=D.refs[L.id];meta='Grupo '+D.grupos[refG[L.id]]+' › '+D.subs[refS[L.id]][1]+' · Marca '+D.marcas[rr[3]]}
  h+='<div class="lhead"><div><div class="over">'+esc(I.over)+'</div><h2>'+esc(I.name)+(I.desc?' <span class="desc">'+esc(I.desc)+'</span>':'')+'</h2><div class="lmeta">'+esc(meta)+'</div></div></div>';
  h+=kpisHTML(L,C);
  if(X.pcs===0&&X.fat===0&&L.t!=='geral'){
    h+='<div class="card empty">Este item não teve vendas no período e nos canais selecionados. Ajuste os filtros para ver os números.</div>';
  }else{
    h+='<div class="grid2">'+monthHTML(C)+chanHTML(C)+'</div>';
    if(L.t==='geral')h+=destHTML(C);
    if(L.t==='r')h+=refHTML(L,C);else h+=listHTML(L,C);
  }
  if(L.t!=='geral')h+=commentHTML(L.t+L.id);
  document.getElementById('view').innerHTML=h;
  document.getElementById('foot').innerHTML='<span>Fonte: '+esc(D.fonte)+' · dados gerados em '+fmtDate(D.geradoEm)+'. Só operações de VENDA (pedidos concluídos e em aberto).</span><span>Faturamento = valor líquido do item. Margem = (fat. − custo) ÷ fat., nos itens com custo cadastrado.</span>';
  document.title=(L.t==='geral'?'Geral':I.short)+' · Relatório de Vendas · HBN Hub';
}

/* ---------- tooltip do gráfico ---------- */
var tip=document.getElementById('tip'),tipOn=false;
function showTip(col,x,y){
  var i=+col.getAttribute('data-mi'),o=C.mon[i],mp=mparts(i),tot=C.X.fat;
  tip.innerHTML='<b>'+cap(mp[2])+(i===PARC?' · em andamento':'')+'</b><span>Faturamento <em>'+R(o.fat)+'</em></span><span>Peças <em>'+N(o.pcs)+'</em></span><span>Preço médio <em>'+(o.pcs?R(o.fat/o.pcs):'—')+'</em></span><span>% do período <em>'+P(tot?o.fat/tot:NaN)+'</em></span>';
  tip.classList.add('on');tipOn=true;
  document.querySelectorAll('.col.hl').forEach(function(c){c.classList.remove('hl')});col.classList.add('hl');
  var w=tip.offsetWidth,hh=tip.offsetHeight,vw=window.innerWidth;
  var r=col.getBoundingClientRect(),lx=x==null?r.left+r.width/2:x,ly=y==null?r.top+20:y;
  var left=Math.min(vw-w-8,Math.max(8,lx-w/2)),top=ly-hh-14;if(top<8)top=ly+18;
  tip.style.left=left+'px';tip.style.top=top+'px';
}
function hideTip(){tip.classList.remove('on');tipOn=false;document.querySelectorAll('.col.hl').forEach(function(c){c.classList.remove('hl')})}
document.addEventListener('pointermove',function(e){if(e.pointerType==='touch')return;var col=e.target.closest&&e.target.closest('.col');if(col)showTip(col,e.clientX,e.clientY-6);else if(tipOn)hideTip()});
document.addEventListener('pointerdown',function(e){if(e.pointerType!=='touch'&&e.pointerType!=='pen')return;var col=e.target.closest&&e.target.closest('.col');if(col)showTip(col,null,col.getBoundingClientRect().top+40);else if(tipOn)hideTip()});
window.addEventListener('scroll',function(){if(tipOn)hideTip()},{passive:true});

/* ---------- cliques ---------- */
/* Links internos (#/g/0, #/s/3, #/r/12) são tratados aqui: dentro do HBN Hub o
   relatório roda num iframe srcdoc, cuja URL-base é a do Hub — sem isso, o link
   abriria o Hub inteiro dentro do quadro. */
document.addEventListener('click',function(e){
  var a=e.target.closest&&e.target.closest('a[href^="#"]');
  if(!a||e.defaultPrevented||e.button>0||e.metaKey||e.ctrlKey||e.shiftKey)return;
  e.preventDefault();go(a.getAttribute('href'));
  if(a.closest('#sres'))closeSearch();
});
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-p],[data-m],[data-ch],[data-sort],[data-mode],[data-all],[data-regen],tr[data-href],[data-close]');
  if(!t)return;
  if(t.hasAttribute('data-close')){closeSheets();return}
  if(t.hasAttribute('data-p')){var k=t.getAttribute('data-p');
    if(k==='custom'){S.custom=true;S.pick=null}else{var p=PRE.filter(function(x){return x.k===k})[0];S.a=p.a;S.b=p.b;S.custom=false;S.pick=null}
    S.all=false;render();return}
  if(t.hasAttribute('data-m')){var m=+t.getAttribute('data-m');
    if(S.pick===null){S.pick=m;S.a=m;S.b=m}else{S.a=Math.min(S.pick,m);S.b=Math.max(S.pick,m);S.pick=null}
    render();return}
  if(t.hasAttribute('data-ch')){var c=t.getAttribute('data-ch');
    if(c==='all')S.ch=[1,1,1,1,1];
    else{c=+c;if(chOn()===NC){S.ch=[0,0,0,0,0];S.ch[c]=1}else{S.ch[c]=S.ch[c]?0:1;if(!chOn())S.ch=[1,1,1,1,1]}}
    render();return}
  if(t.hasAttribute('data-sort')){S.sort=t.getAttribute('data-sort');render();return}
  if(t.hasAttribute('data-mode')){S.mode=t.getAttribute('data-mode');render();return}
  if(t.hasAttribute('data-all')){S.all=!S.all;render();return}
  if(t.hasAttribute('data-regen')){delete E.destaques;markDirty();render();return}
  if(t.tagName==='TR'){if(e.target.closest('a'))return;go(t.getAttribute('data-href'))}
});

/* ---------- navegação ---------- */
window.addEventListener('hashchange',function(){

  if(navStack.length>1&&navStack[navStack.length-2]===h)navStack.pop();else navStack.push(h);

/* ---------- edição ---------- */
var titleEl=document.getElementById('title');
titleEl.textContent=typeof E.title==='string'?E.title:'Relatório de Vendas · '+cap(mlab(0))+' a '+cap(mlab(NM-1));
titleEl.addEventListener('input',function(){E.title=titleEl.textContent;markDirty()});

document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='destbody'){E.destaques=t.innerHTML;markDirty()}
  else if(t.hasAttribute&&t.hasAttribute('data-ck')){var v=t.innerText.replace(/\n$/,'');if(v.trim())E['c_'+t.getAttribute('data-ck')]=v;else{delete E['c_'+t.getAttribute('data-ck')];t.innerHTML=''}markDirty()}

document.addEventListener('paste',function(e){

  e.preventDefault();var txt=(e.clipboardData||window.clipboardData).getData('text/plain');document.execCommand('insertText',false,txt);

window.addEventListener('beforeunload',function(e){if(dirty&&!EMBED){e.preventDefault();e.returnValue=''}});

/* Salvar versão editada: baixa o próprio HTML com os textos editados gravados dentro. */
function baixar(out){
  var blob=new Blob([out],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  var d=new Date(),stamp=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  a.href=url;a.download='relatorio-vendas-hbn-editado-'+stamp+'.html';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove()},1500);dirty=false;closeSheets();
}
function save(){
  var json=JSON.stringify(E).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026');
  baixar(SRC.replace(/<html([^>]*?)\sdata-embed(="[^"]*")?/,'<html$1').replace(/(<script type="application\/json" id="edits">)[\s\S]*?(<\/script>)/,function(_,a,b){return a+json+b}));
}
document.getElementById('bsave').addEventListener('click',save);
document.getElementById('msave').addEventListener('click',save);
function doPrint(){closeSheets();setTimeout(function(){window.print()},250)}
document.getElementById('bprint').addEventListener('click',doPrint);
document.getElementById('mprint').addEventListener('click',doPrint);
var prevAll=null;
window.addEventListener('beforeprint',function(){prevAll=S.all;if(L.t==='s'&&!S.all){S.all=true;render()}});

/* ---------- tema ---------- */
function isDark(){var t=document.documentElement.getAttribute('data-theme');if(t)return t==='dark';return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches}
function themeLabel(){document.getElementById('mthemeL').textContent=isDark()?'Tema claro':'Tema escuro'}
function toggleTheme(){var d=!isDark();document.documentElement.setAttribute('data-theme',d?'dark':'light');try{localStorage.setItem('hbn-rel-tema',d?'dark':'light')}catch(e){}themeLabel()}
if(EMBED){
  /* Segue o tema do HBN Hub (atributo data-theme da janela de fora). */
  try{var pd=window.parent.document.documentElement;var syncT=function(){var t=pd.getAttribute('data-theme');if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');themeLabel()};syncT();new MutationObserver(syncT).observe(pd,{attributes:true,attributeFilter:['data-theme']})}catch(e){}
}else{try{var st=localStorage.getItem('hbn-rel-tema');if(st==='dark'||st==='light')document.documentElement.setAttribute('data-theme',st)}catch(e){}}
document.getElementById('btheme').addEventListener('click',toggleTheme);
document.getElementById('mtheme').addEventListener('click',function(){toggleTheme();closeSheets()});
themeLabel();

/* ---------- folhas (celular) ---------- */
var scrim=document.getElementById('scrim');
function openSheet(id){closeSearch();document.getElementById(id).classList.add('on');scrim.classList.add('on');document.body.style.overflow='hidden'}
function closeSheets(){document.querySelectorAll('.sheet.on').forEach(function(s){s.classList.remove('on')});scrim.classList.remove('on');document.body.style.overflow=''}
scrim.addEventListener('click',closeSheets);
document.getElementById('fbtn').addEventListener('click',function(){openSheet('sheetF')});
document.getElementById('bmore').addEventListener('click',function(){openSheet('sheetM')});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeSheets();closeSearch()}});

/* ---------- busca ---------- */
var q=document.getElementById('q'),sres=document.getElementById('sres'),band=document.getElementById('band'),sAct=0,sHits=[];
var IDX=D.refs.map(function(r,i){return {i:i,c:norm(r[0]),d:norm(r[1]),k:norm(r[0]).replace(/\s+/g,'')}});
var refTot={};D.f.forEach(function(r){refTot[r[0]]=(refTot[r[0]]||0)+r[4]});
function search(){
  var v=norm(q.value.trim());if(!v){sres.classList.remove('open');sHits=[];return}
  var vk=v.replace(/\s+/g,''),words=v.split(/\s+/);
  sHits=IDX.map(function(o){var sc=0;if(o.c===v||o.k===vk)sc=100;else if(o.c.indexOf(v)===0||o.k.indexOf(vk)===0)sc=60;else if(o.c.indexOf(v)>=0||o.k.indexOf(vk)>=0)sc=40;else if(words.every(function(w){return o.d.indexOf(w)>=0||o.c.indexOf(w)>=0}))sc=20;return {o:o,sc:sc}})
    .filter(function(x){return x.sc>0}).sort(function(a,b){return b.sc-a.sc||(refTot[b.o.i]||0)-(refTot[a.o.i]||0)}).slice(0,12);
  sAct=0;
  if(!sHits.length){sres.innerHTML='<div class="empty">Nenhuma referência encontrada.</div>'}
  else sres.innerHTML=sHits.map(function(x,j){var r=D.refs[x.o.i],s=r[2];return '<a href="#/r/'+x.o.i+'" class="'+(j===0?'act':'')+'" role="option"><span class="sc">'+esc(r[0])+'</span><span class="sd">'+esc(r[1])+'<small>'+esc(D.grupos[subG[s]]+' › '+D.subs[s][1])+'</small></span><span class="sv">'+RA(refTot[x.o.i]||0)+'</span></a>'}).join('');
  sres.classList.add('open');
}
q.addEventListener('input',search);
q.addEventListener('focus',function(){if(q.value.trim())search()});
q.addEventListener('keydown',function(e){
  var items=sres.querySelectorAll('a');
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(!items.length)return;e.preventDefault();items[sAct]&&items[sAct].classList.remove('act');sAct=(sAct+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items[sAct].classList.add('act');items[sAct].scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter'){if(sHits[sAct]){e.preventDefault();go('#/r/'+sHits[sAct].o.i);closeSearch()}}
});
document.addEventListener('pointerdown',function(e){if(!e.target.closest('#searchWrap')&&!e.target.closest('#bsearch'))sres.classList.remove('open')});
function closeSearch(){sres.classList.remove('open');band.classList.remove('searching');q.value='';q.blur()}
document.getElementById('bsearch').addEventListener('click',function(){if(band.classList.contains('searching'))closeSearch();else{band.classList.add('searching');setTimeout(function(){q.focus()},30)}});

render();
window.__HBN={D:D,compute:compute,S:S,render:render,levels:function(){return L}};
})();
