<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: deixa a página usar a área sob o notch e a barra
         de gestos; o CSS devolve o respiro com env(safe-area-inset-*).
         Não há maximum-scale nem user-scalable=no de propósito — bloquear o
         zoom do usuário quebra acessibilidade. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2f1c0d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>HBN Hub</title>
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Aplicativo instalável (PWA). O manifesto é o que faz o Android
         oferecer "Instalar aplicativo" e o que define nome, ícone e a
         abertura em tela cheia (display: standalone).
         A cor do theme-color acima é a MESMA do manifesto (--leather-deep,
         #2f1c0d): é ela que pinta a barra de status do celular. -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iPhone/iPad ignoram o manifesto: o Safari lê estas três tags pra
         "Adicionar à Tela de Início". Sem elas o atalho abre no navegador
         com barra de endereço, em vez de abrir como aplicativo. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HBN Hub" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
